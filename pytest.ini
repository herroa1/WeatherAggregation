[pytest]
testpaths = tests
pythonpath = .
# Live-server and notebook tests are opt-in: run them with `-m live` or `-m notebook`
addopts = -m "not live and not notebook"
markers =
    live: checks against the live data servers, for spotting outages or changed file layouts
    notebook: runs latestForecasts/aggregateForecasts.ipynb end to end (downloads the latest Met Office run, which counts towards the DataHub allowance)
filterwarnings =
    # cfgrib/xarray deprecation notices that don't affect results
    ignore::FutureWarning
